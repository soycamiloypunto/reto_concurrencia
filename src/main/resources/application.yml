spring:
  application:
    name: events-processing
  main:
    web-application-type: reactive

server:
  port: 8080
  shutdown: graceful

logging:
  level:
    root: INFO
    com.trading.events: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# Parámetros de concurrencia y resiliencia. Todo se puede sobreescribir por variable de entorno
# (p. ej. APP_CONCURRENCY_LANES=128).
app:
  concurrency:
    lanes: 64                 # paralelismo máximo entre cuentas
    lane-queue-capacity: 1000 # tareas en espera por lane antes de responder 429
    max-batch-concurrency: 64
    max-batch-size: 1000
  gateway:
    min-latency: 5ms
    max-latency: 20ms
    failure-rate: 0.0         # > 0 solo para pruebas de caos
    timeout: 2s
    bulkhead-max-calls: 512
    breaker:
      failure-rate-threshold: 50
      sliding-window-size: 20
      minimum-number-of-calls: 10
      wait-duration-in-open: 10s
    retry:
      max-attempts: 2
      backoff: 50ms
  store:
    max-events: 100000
    ttl: 1h
