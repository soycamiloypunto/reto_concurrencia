# Dos instancias para ilustrar la escalabilidad horizontal.
# IMPORTANTE: el estado (balances) vive en memoria de cada instancia, por lo que todos los eventos de
# una MISMA cuenta deben llegar a la MISMA instancia (partición por accountId; en producción lo haría un
# balanceador con hash consistente o Kafka con key = accountId). Ver docs/CONCURRENCY_MAP.md.
services:
  events-a:
    build: .
    ports:
      - "8081:8080"
    environment:
      APP_CONCURRENCY_LANES: "128"
  events-b:
    build: .
    ports:
      - "8082:8080"
    environment:
      APP_CONCURRENCY_LANES: "128"
